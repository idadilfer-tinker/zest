<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zest</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B14; --plum:#272937; --card:rgba(24,26,42,.94);
  --gold:#e9d09b; --gold-deep:#c9a35c; --cream:#f8eedc; --muted:#c8bed6; --rose:#e88b9e; --sage:#5dbeb0; --safe:#72d5a3;
  --sans:"Plus Jakarta Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.hidden{display:none!important}

.screen{position:fixed;inset:0;display:flex;text-align:center;padding:24px;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,11,20,.35),rgba(10,11,20,.82) 75%);z-index:10}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1;margin:0;color:var(--gold);letter-spacing:-.02em}
.lede{font-family:var(--serif);font-size:clamp(18px,min(2vw,3vh),24px);line-height:1.4;margin:0 auto;max-width:520px;color:var(--muted);font-weight:400}
.btn{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:.04em;color:var(--bg);background:var(--gold);
  border:0;border-radius:999px;padding:20px 64px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 40px rgba(233,208,155,.25)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 14px 50px rgba(233,208,155,.4)}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid rgba(233,208,155,.55);box-shadow:none;font-size:16px;padding:14px 30px;min-height:48px}
.btn.ghost:hover{background:rgba(233,208,155,.12)}
.small{font-size:15px;line-height:1.5;color:var(--muted);max-width:520px;margin:10px auto 0}
.small span{display:block}
[data-privacy]::before{content:'\25CF';color:var(--safe);margin-right:6px;font-size:10px;vertical-align:2px}
.streak{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--rose);margin:0;min-height:1em}
.spinner{width:54px;height:54px;border-radius:50%;border:3px solid rgba(233,208,155,.2);border-top-color:var(--gold);margin:0 auto 26px;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-family:var(--serif);font-size:24px;color:var(--cream);font-weight:400}

.iconbtn{position:fixed;top:14px;right:14px;z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid rgba(233,208,155,.35);
  background:rgba(24,26,42,.85);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(233,208,155,.16)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);border:1px solid rgba(233,208,155,.4);
  padding:14px 26px;border-radius:14px;font-size:16px;z-index:30;max-width:80vw;text-align:center;transition:opacity .4s}

#settings{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--card);border-left:1px solid rgba(233,208,155,.3);
  z-index:20;padding:26px 26px 40px;overflow:auto}
#settings h2{font-family:var(--serif);font-size:30px;margin:0 0 4px;color:var(--gold);font-weight:500;letter-spacing:-.02em}
#settings .sub{color:var(--muted);font-size:15px;margin:0 0 22px}
.grp{margin:0 0 20px}
.grp label{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:600 15px var(--sans);color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  padding:10px 16px;min-height:42px;border-radius:999px;cursor:pointer}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0;line-height:1.45}

/* Welcome screen: brand + controls in the corners, one clear CTA in the centre */
#welcome{display:flex;flex-direction:column;padding:28px 36px;text-align:left}
#welcome>div{margin:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.brand{text-align:left}
.topctl{display:flex;align-items:center;gap:10px}
.hero-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px 0}
.footer-note{text-align:center;padding-top:4px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.langsw{margin-top:4px}
.langsw button{min-height:40px}
@media (max-width:640px){.topbar{justify-content:center}.brand{text-align:center}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:4s}.btn{transition:none}#toast{transition:none}}
</style>
</head>

<main class="screen" id="welcome">
  <div class="topbar">
    <div class="brand">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1>Zest</h1>
    </div>
    <div class="topctl">
      <button class="btn ghost" id="openSettings" data-i18n="settings"></button>
    </div>
  </div>
  <div class="hero-center">
    <p class="streak" id="streak" aria-live="polite"></p>
    <button class="btn" id="begin" data-i18n="begin"></button>
    <p class="lede" id="welcomeLede"></p>
    <div class="seg langsw row" id="langSw" role="group" aria-label="Language"></div>
  </div>
  <div class="footer-note">
    <p class="small"><span data-i18n="small1"></span><span data-privacy data-i18n="small2"></span></p>
  </div>
</main>

<div class="screen hidden" id="loading" role="status" aria-live="polite">
  <div><div class="spinner"></div><div id="loadMsg"></div></div>
</div>

<aside id="settings" class="hidden" role="dialog" aria-label="Settings">
  <h2 data-i18n="s.title"></h2>
  <p class="sub" data-i18n="s.sub"></p>
  <div id="opts"></div>
  <div class="grp"><label id="lblSetup" data-i18n="s.setup"></label>
    <div class="seg" role="group" aria-labelledby="lblSetup">
      <button id="btnRecentre" data-i18n="s.centre"></button>
      <button id="btnRecal" data-i18n="s.recal"></button>
    </div>
    <p class="hint" data-i18n="s.centreHint"></p>
  </div>
  <div class="row" style="margin-top:18px;justify-content:flex-start"><button class="btn ghost" id="closeSettings" data-i18n="s.close"></button></div>
  <p class="hint" data-i18n="s.shortcuts"></p>
</aside>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

// ---------- pointer: mirrored index fingertip, mapped via a calibrated centre ----------
const REACH = .40;

// head yaw estimate, relative to straight-ahead: positive is turned to her right
function faceYaw() {

const TRAIL = [];
function wantHand() { return SETTINGS.hand === 'either' ? null : SETTINGS.hand; }

function onHandResult(res) {

}

  F.lm = fl[0]; F.lastSeen = now();

}

// ---------- canvas dwell buttons: for calibrate/rest/done cards, hands-only friendly ----------
const DWELL_HOLD = 1.15;

function dwellButton(id, x, y, r, active, onFire) {

// =====================================================================
// Zest — rendering: board, fruit, particles, self-view, cards

  rr(x, y, w, h, r); ctx.strokeStyle = 'rgba(233,208,155,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function ringProgress(x, y, r, p, col) {

}

// ---------- background ----------
function drawBg(t) {

// level 2: jellyfish drifting up with pulsing bell and trailing, swaying tentacles

  for (let i = -2; i <= 2; i++) {

// level 3: birds soaring gently upward, wings flapping slowly, no speed or dive required

// a soft grey "rain cloud" balloon — still no penalty, just a gentle visual change of pace

// ---------- directive overlay: a big, translucent illustration + spoken line shown once when a new
// gesture is asked for, so the direction is given both visually and out loud, then fades away ----------
function wrapLines(str, maxW, o = {}) {
  ctx.font = `${o.weight || 600} ${o.size || 20}px ${o.font || SANS}`;
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const next = cur ? cur + ' ' + w : w;
    if (ctx.measureText(next).width > maxW && cur) { lines.push(cur); cur = w; } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawDirectiveIcon(kind, cx, cy, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = COL.gold; ctx.fillStyle = COL.gold; ctx.lineWidth = 6; ctx.lineCap = 'round';
  if (kind === 'bonus') {
    // a simple smiling face: the bonus now welcomes any of a smile, an open mouth, or a head turn
    // (the words below spell out all three; this is just the friendliest one to draw)
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, TAU); ctx.globalAlpha = a * .22; ctx.fill();
    ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(cx, cy, 34, 0, TAU); ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 12, cy - 6, 3.4, 0, TAU); ctx.arc(cx + 12, cy - 6, 3.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy - 2, 16, Math.PI * .12, Math.PI * .88); ctx.lineWidth = 5; ctx.stroke();
  } else if (kind === 'mouth') {
    // an open mouth: "open your mouth"
    ctx.beginPath(); ctx.ellipse(cx, cy, 34, 26, 0, 0, TAU); ctx.globalAlpha = a * .22; ctx.fill();
    ctx.globalAlpha = a; ctx.beginPath(); ctx.ellipse(cx, cy, 34, 26, 0, 0, TAU); ctx.lineWidth = 5; ctx.stroke();
  } else if (kind === 'turn') {
    // a face silhouette with a curved arrow: "turn your head"
    ctx.beginPath(); ctx.arc(cx, cy, 30, 0, TAU); ctx.globalAlpha = a * .22; ctx.fill();
    ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, TAU); ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 52, -Math.PI * .65, -Math.PI * .1); ctx.lineWidth = 5; ctx.stroke();
    const ax = cx + Math.cos(-Math.PI * .1) * 52, ay = cy + Math.sin(-Math.PI * .1) * 52;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 10, ay - 9); ctx.lineTo(ax + 4, ay + 11); ctx.closePath(); ctx.fill();
  }

}
function drawDirective() {
  if (!DIRECTIVE.active) return;
  const fadeIn = .4, fadeOut = 1.1, tt = DIRECTIVE.t, dur = DIRECTIVE.dur;
  let a = 1;
  if (tt < fadeIn) a = tt / fadeIn; else if (tt > dur - fadeOut) a = Math.max(0, (dur - tt) / fadeOut);
  if (a <= 0) return;
  const cx = W / 2, cy = H2 / 2 - 20;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy - 6, 130, 0, TAU); ctx.fillStyle = `rgba(10,11,20,${.5 * a})`; ctx.fill();
  drawDirectiveIcon(DIRECTIVE.icon, cx, cy - 46, a);
  const lines = wrapLines(t(DIRECTIVE.key), 320, { size: 22, weight: 700 });
  ctx.globalAlpha = a;
  lines.forEach((ln, i) => txt(ln, cx, cy + 46 + i * 28, { size: 22, weight: 700, color: COL.cream, align: 'center' }));
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- self view with hand/face landmarks (mirrored) ----------
function drawConn(lm, conns, mp, color, lw, dots) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  for (const c of conns) { const a = lm[c.start], b = lm[c.end]; if (!a || !b) continue; const [x1, y1] = mp(a), [x2, y2] = mp(b); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
  ctx.stroke();
  if (dots) { ctx.fillStyle = color; for (const p of lm) { const [x, y] = mp(p); ctx.beginPath(); ctx.arc(x, y, lw * 1.1, 0, TAU); ctx.fill(); } }
}
function drawSelf(x, y, w, h, r) {
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.fillStyle = '#0d0918'; ctx.fillRect(x, y, w, h);
  if (S.camOn && video.readyState >= 2) {
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480, sc = Math.max(w / vw, h / vh), dw = vw * sc, dh = vh * sc, ox = (w - dw) / 2, oy = (h - dh) / 2;
    ctx.save(); ctx.translate(x + ox + dw, y + oy); ctx.scale(-1, 1); ctx.globalAlpha = .9; ctx.drawImage(video, 0, 0, dw, dh); ctx.restore();
    const mp = p => [x + ox + (1 - p.x) * dw, y + oy + p.y * dh];
    if (MP && H.lm && now() - H.lastSeen < 500) drawConn(H.lm, MP.HandLandmarker.HAND_CONNECTIONS, mp, 'rgba(233,208,155,.95)', Math.max(1.5, w / 130), true);
    if (MP && F.lm && now() - F.lastSeen < 500) { const FL = MP.FaceLandmarker; ['FACE_LANDMARKS_LIPS', 'FACE_LANDMARKS_FACE_OVAL'].forEach(k => FL[k] && drawConn(F.lm, FL[k], mp, 'rgba(248,238,220,.6)', Math.max(1, w / 220), false)); }
  } else { txt('camera off', x + w / 2, y + h / 2, { size: 16, color: COL.muted, align: 'center', italic: true, shadow: false }); }
  ctx.restore(); rr(x, y, w, h, r); ctx.strokeStyle = 'rgba(233,208,155,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
}

// ---------- cards: calibrate / rest / done ----------

// =====================================================================
// Zest — main loop, screens, settings wiring, test hooks
// =====================================================================
function toast(msg, ms = 3200) {
  const el = $('#toast'); el.textContent = msg; el.classList.remove('hidden'); el.style.opacity = '1';
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 400); }, ms);
}

function showWelcome() {
  S.mode = 'menu'; $('#welcome').classList.remove('hidden'); $('#gear').classList.add('hidden');
  applyLang();
}
function hideWelcome() { $('#welcome').classList.add('hidden'); }

async function begin() {
  hideWelcome(); $('#loading').classList.remove('hidden'); const msg = m => $('#loadMsg').textContent = m;
  say('say.beginIntro');
  try {
    msg(t('load.cam')); await startCamera();
    if (SETTINGS.voiceFrenzy) { try { await startMic(); } catch (e) { setSetting('voiceFrenzy', false); } }
    msg(t('load.hand')); await loadModels(msg);
    if (!S.models.hand) { toast(t('t.hand')); setSetting('control', 'mouse'); }
  } catch (e) {
    toast(t('t.cam')); setSetting('control', 'mouse');
  }
  $('#loading').classList.add('hidden'); $('#gear').classList.remove('hidden');
  layout(); resetWorld();
  S._spokenMode = null; S._spokenPlayIntro = false;
  if (SETTINGS.control === 'mouse') { S.mode = 'play'; S.sessionStart = now(); }
  else { S.mode = 'calibrate'; CAL.ok = 0; CAL.t = 0; CAL.done = false; }
  requestAnimationFrame(loop);
}

// ---------- a short spoken line whenever the mode changes, never repeated for the same mode ----------
function speakForMode() {
  if (S.mode === S._spokenMode) return;
  S._spokenMode = S.mode;
  if (S.mode === 'calibrate') say('say.calibrate', null, { interrupt: true });
  else if (S.mode === 'play' && !S._spokenPlayIntro) { S._spokenPlayIntro = true; say('say.playIntro', null, { interrupt: true }); }
  else if (S.mode === 'rest') say('say.rest', null, { interrupt: true });
  else if (S.mode === 'done') say('say.done', null, { interrupt: true });
}

// ---------- mouse fallback ----------
canvas.addEventListener('mousemove', e => {
  if (SETTINGS.control !== 'mouse') return;
  const r = canvas.getBoundingClientRect();
  MOUSE.active = true; MOUSE.bx = e.clientX - r.left; MOUSE.by = e.clientY - r.top;
});
canvas.addEventListener('mouseleave', () => { MOUSE.active = false; });

// ---------- main loop ----------
let lastT = null, restAt = 240, doneAt = 600 * 5; // rest ~4min, gentle close ~50min (generous, never forced)
function loop(t) {
  if (lastT == null) lastT = t;
  let dt = (t - lastT) / 1000; lastT = t; dt = Math.min(dt, .05);
  DT_LAST = dt;
  if (!S.hold && document.visibilityState === 'visible') {
    if (S.mode !== 'menu') {
      if (S.models.hand || S.models.face) {
        detectFrame(t);
      }
      readMic(dt);
      if (S.mode === 'calibrate') updateCalibration(dt);
      if (S.mode === 'play') { updatePointer(dt); updateWorld(dt); updateBonusGesture(dt); updateFaceJelly(dt); updateDirective(dt); updateAmbientVoice(dt); }
    }
    updateTweens();
  }
  render(t);
  requestAnimationFrame(loop);
}

async function detectFrame(t) {
  if (!video || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  phase++;
  try {
    if (handLM && (phase % 2 === 0 || !faceLM)) onHandResult(await handLM.detectForVideo(video, t) || {});
    else if (faceLM) onFaceResult(await faceLM.detectForVideo(video, t) || {});
  } catch (e) { /* transient */ }
}

function render(t) {
  speakForMode();
  drawBg(t);
  if (S.mode === 'play' || S.mode === 'calibrate' || S.mode === 'rest' || S.mode === 'done') {
    drawParticles();
    for (const o of objects) drawFruit(o);
    drawTrail(); drawPointer(); drawHUD(); drawDirective();
  }
  if (S.mode === 'calibrate') calCard();
  if (S.mode === 'rest') restCard('rest');
  if (S.mode === 'done') restCard('done');
  if (SETTINGS.selfview && S.camOn && S.mode !== 'menu') drawSelf(W - 168, 66, 148, 110, 14);
  if (S.mode === 'play' && S.sessionStart) {
    const elapsed = (now() - S.sessionStart) / 1000;
    if (elapsed > restAt && !S._rested) { S._rested = true; S.mode = 'rest'; }
    else if (elapsed > doneAt) { S.mode = 'done'; }
  }
}

// ---------- settings UI ----------
function renderOpts() {
  const rows = [
    ['control', [['hand', t('opt.control.hand')], ['mouse', t('opt.control.mouse')]]],
    ['hand', [['either', t('opt.hand.either')], ['left', t('opt.hand.left')], ['right', t('opt.hand.right')]]],
    ['pace', [['calm', t('opt.pace.calm')], ['lively', t('opt.pace.lively')]]],
  ];
  const rowLabel = { control: 'opt.control', hand: 'opt.hand', pace: 'opt.pace' };
  const el = $('#opts'); el.innerHTML = '';
  rows.forEach(([key, opts]) => {
    const grp = document.createElement('div'); grp.className = 'grp';
    const lab = document.createElement('label'); lab.textContent = t(rowLabel[key]); grp.appendChild(lab);
    const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group');
    opts.forEach(([v, label]) => {
      const b = document.createElement('button'); b.textContent = label; b.className = SETTINGS[key] === v ? 'on' : ''; b.setAttribute('aria-pressed', SETTINGS[key] === v);
      b.onclick = () => { setSetting(key, v); renderOpts(); };
      seg.appendChild(b);
    });
    grp.appendChild(seg); el.appendChild(grp);
  });
  const toggles = [['sound', 'opt.sound'], ['voicePrompts', 'opt.voicePrompts'], ['selfview', 'opt.selfview'], ['voiceFrenzy', 'opt.voiceFrenzy'], ['browBonus', 'opt.browBonus'], ['faceJelly', 'opt.faceJelly']];
  toggles.forEach(([key, labelKey]) => {
    const grp = document.createElement('div'); grp.className = 'grp';
    const lab = document.createElement('label'); lab.textContent = t(labelKey); grp.appendChild(lab);
    const seg = document.createElement('div'); seg.className = 'seg';
    [[true, t('on')], [false, t('off')]].forEach(([v, l]) => {
      const b = document.createElement('button'); b.textContent = l; b.className = SETTINGS[key] === v ? 'on' : ''; b.setAttribute('aria-pressed', SETTINGS[key] === v);
      b.onclick = () => { setSetting(key, v); renderOpts(); };
      seg.appendChild(b);
    });
    grp.appendChild(seg); el.appendChild(grp);
  });
  const lgrp = document.createElement('div'); lgrp.className = 'grp';
  const llab = document.createElement('label'); llab.textContent = t('opt.lang'); lgrp.appendChild(llab);
  const lseg = document.createElement('div'); lseg.className = 'seg'; lseg.setAttribute('role', 'group');
  Object.keys(LANG_META).forEach(k => {
    const b = document.createElement('button'); b.textContent = LANG_META[k].name; b.lang = LANG_META[k].html; b.dataset.lang = k;
    b.className = SETTINGS.lang === k ? 'on' : ''; b.setAttribute('aria-pressed', SETTINGS.lang === k);
    b.onclick = () => { setSetting('lang', k); renderOpts(); };

}
function openSettings(open) {
